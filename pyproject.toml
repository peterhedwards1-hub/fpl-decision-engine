[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "fpl-decision-engine"
version = "0.3.0"
description = "Reproducible Fantasy Premier League decision support"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Peter Edwards" }]
dependencies = []

[project.scripts]
fpl-history = "fpl_engine.history.cli:main"
fpl-collect = "fpl_engine.live.cli:main"
fpl-app = "fpl_engine.ui.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.5",
]
ui = [
  "pandas>=2.2,<3",
  "pulp>=3.2,<4",
  "streamlit>=1.47",
]
optimize = [
  "pulp>=3.2,<4",
]
modeling = [
  "optuna>=4.5,<5",
  "scikit-learn>=1.7,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_engine"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore:Constructing LpVariable.*:DeprecationWarning:pulp.*",
  "ignore:PULP_CBC_CMD.*:DeprecationWarning:pulp.*",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/fpl_engine/history/schema.py" = ["E501"]
"src/fpl_engine/rules.py" = ["E501"]
"tests/test_history_database.py" = ["I001"]
"tests/test_rules.py" = ["I001"]
