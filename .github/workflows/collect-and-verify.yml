name: Collect and verify FPL data

on:
  schedule:
    # Monday, Thursday and Friday during the FPL season. Multiple weekly
    # captures protect midweek and shifted deadlines.
    - cron: "15 12 * 1-5,7-12 1,4,5"
  workflow_dispatch:
    inputs:
      season_code:
        description: Season code used in the database
        required: true
        default: 2026-27
      season_name:
        description: Human-readable season name
        required: true
        default: 2026/27

permissions:
  contents: write

concurrency:
  group: fpl-snapshot-${{ inputs.season_code || '2026-27' }}
  cancel-in-progress: false

jobs:
  collect:
    name: Build verification report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SEASON_CODE: ${{ inputs.season_code || '2026-27' }}
      SEASON_NAME: ${{ inputs.season_name || '2026/27' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector
        run: python -m pip install -e .

      - name: Restore durable snapshot branch
        shell: bash
        run: |
          if git ls-remote --exit-code origin refs/heads/snapshot-data; then
            git worktree add ../snapshot-store origin/snapshot-data
            git -C ../snapshot-store switch -C snapshot-data origin/snapshot-data
          else
            git worktree add --detach ../snapshot-store HEAD
            git -C ../snapshot-store switch --orphan snapshot-data
            git -C ../snapshot-store rm -rf .
          fi
          mkdir -p data/raw
          if [ -d ../snapshot-store/data/raw/fpl ]; then
            cp -a ../snapshot-store/data/raw/fpl data/raw/
          fi

      - name: Collect and verify current data
        run: |
          fpl-collect \
            --database data/fpl.sqlite3 \
            --archive-root data/raw/fpl \
            --report-root data/reports/fpl \
            --season-code "$SEASON_CODE" \
            --season-name "$SEASON_NAME" \
            --rebuild-from-archives

      - name: Persist immutable public snapshots
        shell: bash
        run: |
          mkdir -p ../snapshot-store/data/raw/fpl
          cp -a data/raw/fpl/. ../snapshot-store/data/raw/fpl/
          git -C ../snapshot-store config user.name "github-actions[bot]"
          git -C ../snapshot-store config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C ../snapshot-store add data/raw/fpl
          if git -C ../snapshot-store diff --cached --quiet; then
            echo "No new snapshot files to persist."
          else
            git -C ../snapshot-store commit -m "Archive FPL snapshot for $SEASON_CODE"
            git -C ../snapshot-store push origin HEAD:snapshot-data
          fi

      - name: Add report link instructions
        run: |
          echo "## FPL verification report" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the artifact below and open:" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "data/reports/fpl/$SEASON_CODE/latest/index.html" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload database and verification files
        uses: actions/upload-artifact@v4
        with:
          name: fpl-verification-${{ inputs.season_code }}
          retention-days: 14
          if-no-files-found: error
          path: |
            data/fpl.sqlite3
            data/raw/fpl
            data/reports/fpl
