name: Collect and verify FPL data

on:
  workflow_dispatch:
    inputs:
      season_code:
        description: Season code used in the database
        required: true
        default: 2026-27
      season_name:
        description: Human-readable season name
        required: true
        default: 2026/27

permissions:
  contents: read

jobs:
  collect:
    name: Build verification report
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SEASON_CODE: ${{ inputs.season_code }}
      SEASON_NAME: ${{ inputs.season_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install collector
        run: python -m pip install -e .

      - name: Collect and verify current data
        run: |
          fpl-collect \
            --database data/fpl.sqlite3 \
            --archive-root data/raw/fpl \
            --report-root data/reports/fpl \
            --season-code "$SEASON_CODE" \
            --season-name "$SEASON_NAME"

      - name: Add report link instructions
        run: |
          echo "## FPL verification report" >> "$GITHUB_STEP_SUMMARY"
          echo "Download the artifact below and open:" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          echo "data/reports/fpl/$SEASON_CODE/latest/index.html" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload database and verification files
        uses: actions/upload-artifact@v4
        with:
          name: fpl-verification-${{ inputs.season_code }}
          retention-days: 14
          if-no-files-found: error
          path: |
            data/fpl.sqlite3
            data/raw/fpl
            data/reports/fpl
