name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet -e ".[dev,optimize,modeling,ui]"

      - name: Lint
        run: python -m ruff check . --output-format=concise

      - name: Test
        run: python -m pytest

      - name: Database initialisation smoke test
        run: |
          python -m fpl_engine.history.cli \
            --database data/ci-smoke.sqlite3 init

      - name: UI launch smoke test
        env:
          FPL_DATABASE_PATH: data/ci-ui-smoke.sqlite3
        run: |
          python -c "from streamlit.testing.v1 import AppTest; app = AppTest.from_file('src/fpl_engine/ui/app.py').run(timeout=30); assert not app.exception, app.exception"
